name: Windows build and release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and build Windows ZIP
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload interface previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kushat-UI-previews
          path: artifacts/ui/*.png
          if-no-files-found: ignore
      - name: Upload downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kushat-Windows-x64
          path: artifacts/Kushat-reference-win-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Kushat-Windows-x64
          path: release
      - name: Publish ZIP in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/Kushat-reference-win-x64.zip \
            --target "$RELEASE_COMMIT" \
            --title "Кушать — $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md
